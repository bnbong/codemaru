name: "codemaru card"
description: "Generate a codemaru developer summary card SVG and write it into your repository."
author: "bnbong"
branding:
  icon: "award"
  color: "purple"

inputs:
  github:
    description: "GitHub username to summarize."
    required: true
  boj:
    description: "solved.ac / BOJ handle (optional)."
    required: false
    default: ""
  leetcode:
    description: "LeetCode handle (optional)."
    required: false
    default: ""
  jungol:
    description: "JungOl / 정올 handle (optional)."
    required: false
    default: ""
  theme:
    description: "Card theme: default | dark | transparent."
    required: false
    default: "default"
  compact:
    description: "Use the compact (tier-panel-only) layout."
    required: false
    default: "false"
  animate:
    description: "Embed the one-shot entrance animation in the card (true/false)."
    required: false
    default: "true"
  out:
    description: "Output path for the generated SVG."
    required: false
    default: "profile/codemaru.svg"
  github-token:
    description: "Token used to read public GitHub data. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}
  python-version:
    description: "Python version used to run the generator."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      # uv resolves and installs an order of magnitude faster than pip, and this
      # step runs on every card refresh in every consumer's repo. setup-python
      # above still provides the interpreter uv installs into (--system).
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        # No cache: this runs inside the consumer's repo, and setup-uv's auto
        # cache would key off *their* workspace lockfiles (codemaru's own live
        # under github.action_path), so it would write a mis-keyed entry into
        # their Actions cache quota for no gain.
        enable-cache: false

    - name: Install codemaru
      shell: bash
      run: uv pip install --system --quiet "${{ github.action_path }}"

    - name: Generate card
      shell: bash
      # Inputs are passed via env (not interpolated into the script) to avoid
      # shell injection from untrusted handle values.
      env:
        FIXTURE_MODE: "false"
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IN_GITHUB: ${{ inputs.github }}
        IN_BOJ: ${{ inputs.boj }}
        IN_LEETCODE: ${{ inputs.leetcode }}
        IN_JUNGOL: ${{ inputs.jungol }}
        IN_THEME: ${{ inputs.theme }}
        IN_COMPACT: ${{ inputs.compact }}
        IN_ANIMATE: ${{ inputs.animate }}
        IN_OUT: ${{ inputs.out }}
      run: |
        args=(--github "$IN_GITHUB" --theme "$IN_THEME" --out "$IN_OUT")
        [ -n "$IN_BOJ" ] && args+=(--boj "$IN_BOJ")
        [ -n "$IN_LEETCODE" ] && args+=(--leetcode "$IN_LEETCODE")
        [ -n "$IN_JUNGOL" ] && args+=(--jungol "$IN_JUNGOL")
        [ "$IN_COMPACT" = "true" ] && args+=(--compact)
        [ "$IN_ANIMATE" = "false" ] && args+=(--no-animate)
        codemaru generate "${args[@]}"
